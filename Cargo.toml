[package]
name = "kube-rbac-proxy"
version = "0.1.0"
edition = "2021"
description = "A small HTTP proxy with Kubernetes-style RBAC authorization"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
http = "1"
pingora = { version = "0.9.0", features = ["proxy", "rustls"] }
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
url = "2"
